<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Logo IBETHEL AGEIB</title>
  <desc id="desc">Logo compact pour IBETHEL AGEIB avec emblème et nom de marque</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eb9a4f"/>
      <stop offset="100%" stop-color="#cd5717"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2e2a24"/>
      <stop offset="100%" stop-color="#1e1d1b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2b241d" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g transform="translate(450 160)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="102" fill="url(#g1)"/>
    <g transform="rotate(-10)">
      <rect x="-40" y="-45" width="80" height="108" rx="12" fill="#fff" opacity="0.96"/>
      <rect x="-32" y="-24" width="64" height="8" rx="4" fill="#f2d8c0"/>
      <rect x="-32" y="-8" width="52" height="8" rx="4" fill="#f2d8c0"/>
      <rect x="-32" y="8" width="40" height="8" rx="4" fill="#f2d8c0"/>
    </g>
    <g transform="translate(56 -42)">
      <circle cx="0" cy="0" r="30" fill="#fff"/>
      <path d="M-11 -4c6-10 20-10 26 0 6 10-2 21-13 27-11-6-19-17-13-27z" fill="url(#g1)"/>
      <circle cx="14" cy="-12" r="4" fill="#fff"/>
    </g>
  </g>

  <text x="450" y="330" text-anchor="middle" font-family="Sora, Manrope, Arial, sans-serif" font-size="82" font-weight="700" letter-spacing="6" fill="url(#g2)">IBETHEL</text>

  <rect x="365" y="350" width="170" height="48" rx="24" fill="url(#g1)"/>
  <text x="450" y="382" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="2" fill="#ffffff">AGEIB</text>

  <text x="450" y="438" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="1" fill="#5f594f">IMPRIMERIE &amp; COMMUNICATION VISUELLE</text>
</svg>
